<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css">
    <title>FarmaOne - Mi Cuenta</title>
  </head>
  <body>
    <header class="navbar">
      <a class="brand" href="../index.html"><span>FarmaOne</span></a>
      <button class="menu-toggle" id="btn-menu" aria-label="Abrir menú">&#9776;</button>
    </header>

    <nav class="menu" id="nav-menu">
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li>
          <details>
            <summary style="cursor: pointer; color: #0995d6; font-weight: bold; font-size: 1.1rem;">Categorías ▼</summary>
            <ul style="list-style: none; padding-top: 10px; text-align: center;">
              <!-- Estos enlaces no llevan ../ porque estarán en la misma carpeta que cuenta.html -->
              <li style="margin-bottom: 10px;"><a href="medicamentos.html">Medicamentos</a></li>
              <li style="margin-bottom: 10px;"><a href="suplementos.html">Suplementos y Vitaminas</a></li>
              <li style="margin-bottom: 10px;"><a href="equipos.html">Equipos Médicos</a></li>
            </ul>
          </details>
        </li>
        <li><a href="cuidado-personal.html">Cuidado Personal</a></li>
        <li><a href="ofertas.html">Ofertas del Mes</a></li>
        <li><a href="carrito.html">Carrito (0) 🛒</a></li>
        <li><a href="cuenta.html">Mi Cuenta / Registro</a></li>
      </ul>
    </nav>

    <section id="login" style="background-color: #ffffff; min-height: calc(100vh - 60px); display: flex; justify-content: center; align-items: center;">
      <div style="background-color: #f4f8fb; padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px;">
        <h2 style="text-align: center; color: #333; margin-top: 0;">Iniciar Sesión</h2>
        
        <form action="#" method="post" style="display: flex; flex-direction: column; gap: 20px; margin-top: 20px;">
          <div style="text-align: left;">
            <label for="usuario" style="font-weight: bold; color: #333; display: block; margin-bottom: 5px;">Correo Electrónico:</label>
            <input type="email" id="usuario" name="usuario" placeholder="Ej: juan@correo.com" required 
                   style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1rem;">
          </div>
          <div style="text-align: left;">
            <label for="contrasena" style="font-weight: bold; color: #333; display: block; margin-bottom: 5px;">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="********" required 
                   style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 1rem;">
          </div>
          <button type="submit" style="background-color: #0995d6; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 1.1rem; cursor: pointer; font-weight: bold; transition: 0.3s;">
            Ingresar
          </button>
        </form>
        <p style="text-align: center; margin-top: 25px; font-size: 0.95rem; color: #555;">
          ¿Aún no tienes una cuenta? <br><br>
          <a href="registro.html" style="color: #0995d6; font-weight: bold; text-decoration: none;">Regístrate aquí</a>
        </p>
      </div>
    </section>

    <script>
      const btn = document.getElementById('btn-menu');
      const menu = document.getElementById('nav-menu');

      btn.addEventListener('click', () => {
        menu.classList.toggle('active');
      });
    </script>
  </body>
</html>
