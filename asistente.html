
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmaOne AI - Asistente virtual</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .ai-container {
      max-width: 850px;
      margin: 35px auto;
      padding: 20px;
    }

    .ai-header {
      background: #087fbd;
      color: white;
      padding: 22px;
      border-radius: 15px 15px 0 0;
    }

    .ai-header h2 {
      margin: 0 0 5px;
    }

    .ai-header p {
      margin: 0;
    }

    .ai-chat {
      background: #f3f6f9;
      border: 1px solid #ddd;
      height: 430px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ai-message {
      padding: 12px 16px;
      border-radius: 13px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .ai-message.bot {
      background: white;
      color: #263238;
      align-self: flex-start;
      border: 1px solid #ddd;
    }

    .ai-message.user {
      background: #087fbd;
      color: white;
      align-self: flex-end;
    }

    .ai-input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: white;
      border: 1px solid #ddd;
      border-top: none;
      border-radius: 0 0 15px 15px;
    }

    #ai-input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 15px;
    }

    #ai-send {
      border: none;
      background: #087fbd;
      color: white;
      padding: 0 22px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }

    #ai-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .ai-status {
      color: #555;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    @media(max-width: 600px) {
      .ai-container {
        margin: 15px auto;
        padding: 10px;
      }

      .ai-chat {
        height: 55vh;
      }

      .ai-message {
        max-width: 92%;
      }

      #ai-send {
        padding: 0 15px;
      }
    }
  </style>
</head>

<body>

  <main class="ai-container">

    <section class="ai-header">
      <h2>FarmaOne AI</h2>
      <p>Asistente virtual de FarmaOne</p>
    </section>

    <section class="ai-chat" id="ai-chat" aria-live="polite">
      <div class="ai-message bot">
        ¡Hola! Soy FarmaOne AI. Estoy aquí para ayudarte con nuestra tienda, el catálogo y los pedidos. ¿Qué necesitas saber?
      </div>
    </section>

    <form class="ai-input-area" id="ai-form">
      <input
        type="text"
        id="ai-input"
        placeholder="Escribe tu pregunta..."
        maxlength="2000"
        autocomplete="off"
        required
      >
      <button type="submit" id="ai-send">Enviar</button>
    </form>

    <p class="ai-status" id="ai-status">
      Asistente conectado a inteligencia artificial.
    </p>

  </main>

  <script type="module">
    import { supabase } from './supabase.js';

    const form = document.getElementById('ai-form');
    const input = document.getElementById('ai-input');
    const chat = document.getElementById('ai-chat');
    const sendButton = document.getElementById('ai-send');
    const status = document.getElementById('ai-status');

    function addMessage(message, type) {
      const element = document.createElement('div');
      element.className = `ai-message ${type}`;
      element.textContent = message;

      chat.appendChild(element);
      chat.scrollTop = chat.scrollHeight;

      return element;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const message = input.value.trim();

      if (!message || sendButton.disabled) return;

      addMessage(message, 'user');

      input.value = '';
      sendButton.disabled = true;
      input.disabled = true;
      status.textContent = 'FarmaOne AI está preparando una respuesta...';

      const loading = addMessage('Espera un momento...', 'bot');

      try {
        const { data, error } = await supabase.functions.invoke(
          'farmaone-ai',
          {
            body: { message }
          }
        );

        loading.remove();

        if (error) {
          console.error('Error de Supabase:', error);
          throw new Error('No se pudo conectar con el asistente.');
        }

        if (!data || !data.reply) {
          throw new Error(data?.error || 'La IA no devolvió una respuesta.');
        }

        addMessage(data.reply, 'bot');
        status.textContent = 'Respuesta generada por FarmaOne AI.';

      } catch (error) {
        loading.remove();
        console.error(error);

        addMessage(
          'No pude procesar tu pregunta. Inténtalo nuevamente en unos momentos.',
          'bot'
        );

        status.textContent = 'No se pudo completar la consulta.';
      } finally {
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();
      }
    });
  </script>

</body>
</html>
